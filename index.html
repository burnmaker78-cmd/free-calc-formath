<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Calculator</title>
    <!-- This tag safely tells the browser to go to Google immediately -->
    <meta http-equiv="refresh" content="0; url=https://google.com">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loading-text {
            color: #5f6368;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- This text shows for a split second before the page switches -->
    <div class="loading-text">Opening Google Search...</div>

    <script>
        // JavaScript backup redirect in case the browser blocks the meta tag
        window.location.href = "https://google.com";
    </script>
</body>
</html>
